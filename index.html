<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Origo Sains</title>
<style>
:root{--bg:#fff;--sf:#eefafb;--tx:#12202b;--pr:#00bcd4;--wr:#ff9800;--ok:#4caf50;--gl:rgba(255,255,255,.85)}
body[data-t=dark]{--bg:#121821;--sf:#1c2531;--tx:#fff;--pr:#26d9ee;--wr:#ffb033;--ok:#66c96a;--gl:rgba(18,24,33,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
button,select,input{font:inherit;border-radius:12px;border:1.5px solid var(--pr);padding:9px 12px;background:var(--bg);color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;font-weight:700;box-shadow:0 3px 10px #0003;transition:transform .08s}button:active{transform:scale(.93)}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:8px;z-index:9;justify-content:flex-end}
#top button{background:var(--gl);color:var(--pr);border:1.5px solid var(--pr);backdrop-filter:blur(6px);width:44px;height:44px;padding:0;font-size:18px;border-radius:50%}
.ov{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg) 40%,var(--sf));z-index:5;padding:64px 14px 14px;overflow:auto;touch-action:pan-y}
#menu{text-align:center;padding-top:16vh}
#menu h1{margin:0;font-size:44px;background:linear-gradient(90deg,var(--pr),var(--ok) 55%,var(--wr));-webkit-background-clip:text;background-clip:text;color:transparent}
#menu p{color:var(--ok);margin:6px 0 28px;font-weight:600}
#menu button{display:block;width:min(270px,82%);margin:12px auto;padding:15px;font-size:16px}
#menu .o{background:var(--wr)}#menu small{display:block;margin:24px auto;max-width:320px;opacity:.7;line-height:1.5}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}#q{width:100%}
#packs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}#packs button{padding:6px 12px;background:var(--ok)}
#cnt{font-weight:700;color:var(--pr);margin:6px 0}#startb{width:100%;padding:13px;background:var(--wr);margin:8px 0}
.r{display:flex;align-items:center;gap:8px;padding:11px;margin:6px 0;background:var(--sf);border-radius:14px}
.r b{flex:1;font-size:14px}.r span{opacity:.7;font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r i{font-style:normal;color:#fff;border-radius:8px;padding:2px 7px;font-size:12px;background:var(--ok)}
.r i.h2{background:var(--pr)}.r i.h3,.r i.h4{background:var(--wr)}.r button{padding:6px 12px;min-width:48px}.r button.on{background:var(--ok)}
#pg{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}#hud button,#js{pointer-events:auto}
#x{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--pr),0 0 8px var(--pr)}
#hold{position:absolute;left:10px;top:10px;max-width:calc(100% - 230px);background:var(--gl);border:1.5px solid var(--ok);border-radius:14px;padding:6px 10px;font-size:12px;line-height:1.3;backdrop-filter:blur(6px)}
#hold b{font-size:18px;margin-right:4px}
#pr:not(:empty){position:absolute;left:50%;transform:translateX(-50%);bottom:255px;background:var(--gl);border:1.5px solid var(--pr);padding:6px 16px;border-radius:20px;font-weight:700;backdrop-filter:blur(6px);white-space:nowrap}
#log:not(:empty){position:absolute;left:50%;transform:translateX(-50%);top:62px;max-width:86%;background:var(--wr);color:#fff;padding:8px 16px;border-radius:14px;font-weight:700;text-align:center;box-shadow:0 4px 14px #0004}
#inf{position:absolute;left:10px;top:62px;background:var(--gl);backdrop-filter:blur(6px);border:1.5px solid var(--pr);border-radius:14px;padding:8px 12px;font-size:13px;min-width:140px;max-width:58%}
#inf s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #0003}
.bar{height:6px;border-radius:4px;background:var(--sf);margin:5px 0;overflow:hidden}.bar u{display:block;height:100%;background:var(--ok)}
#pager{position:absolute;left:50%;transform:translateX(-50%);bottom:210px;display:flex;gap:10px;align-items:center;background:var(--gl);border:1.5px solid var(--wr);border-radius:20px;padding:4px 8px;font-size:13px;font-weight:700;pointer-events:auto}
#pager button{padding:4px 12px}
#js{position:absolute;left:20px;bottom:22px;width:124px;height:124px;border-radius:50%;background:var(--gl);border:2px solid var(--pr)}
#kn{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:var(--pr);box-shadow:0 3px 10px #0004}
#act,#pour,#rx{position:absolute;right:16px;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
#act b,#pour b,#rx b{font-size:24px}#act small,#pour small,#rx small{font-size:11px}
#act{bottom:22px;background:var(--wr)}#pour{bottom:108px;background:var(--ok)}#rx{bottom:194px;background:#e53935}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;background:#c62828;color:#fff;padding:10px 12px;border-radius:12px;font-size:12px;word-break:break-word}
.row2{display:flex;gap:8px;justify-content:center;margin:12px auto}.row2 button{margin:0!important;width:auto!important;flex:1;max-width:132px;padding:11px!important;background:var(--ok)}
.jr div{flex:1;font-size:13px;line-height:1.5}.jr em{color:var(--wr);font-style:normal}
#pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,360px);z-index:25;background:var(--bg);border:2px solid var(--ok);border-radius:18px;padding:16px;box-shadow:0 10px 40px #0006;text-align:center}
#pop .eq{font-weight:800;color:var(--pr);font-size:17px}#pop button{margin-top:8px;padding:10px 30px;background:var(--ok)}
.r button[data-m]{background:var(--wr)}
</style></head><body data-t="light">

<div id="mo" class="ov" hidden><h3 data-i="missions"></h3><div id="ml"></div></div><div id="pop" hidden></div>

<script>// ===== UI & status (TIDAK bergantung pada 3D, jadi tombol tetap hidup walau 3D gagal) =====
const $=s=>document.querySelector(s);
let lang=localStorage.lang||'id',theme=localStorage.theme||'light',entered=false,page=0,mode='view';
const T=k=>(I18N[lang]&&I18N[lang][k])||k,GAME={};
const byF={};MATS.forEach(m=>{if(!byF[m.f])byF[m.f]=m});
const BASIC=['HCl','H2SO4','HNO3','NaOH','KOH','NaHCO3','CaCO3','NaCl','CuSO4','AgNO3','KMnO4','Zn','Mg','Na','Fe','H2O','H2O2','MnO2','C6H12O6','CH3COOH','Na2CO3','NH3','KI','BaCl2','C2H5OH','C12H22O11','C20H14O4','Pb(NO3)2','FeCl3'].map(f=>byF[f]&&byF[f].code).filter(Boolean);
let sel;try{sel=new Set(JSON.parse(localStorage.sel||'null')||BASIC)}catch(e){sel=new Set(BASIC)}
const saveSel=()=>{try{localStorage.sel=JSON.stringify([...sel])}catch(e){}};
let qual=+(localStorage.qual||1),snd=localStorage.snd!=='0',JOURNAL=[];try{JOURNAL=JSON.parse(localStorage.jr||'[]')}catch(e){}
const uiOpen=()=>!$('#menu').hidden||!$('#book').hidden||!$('#jr').hidden||!$('#mo').hidden;
let lt=0;function say(m){$('#log').textContent=m;clearTimeout(lt);lt=setTimeout(()=>$('#log').textContent='',4000)}
function showErr(m){const l=$('#err');l.hidden=false;l.textContent='⚠ '+m}
window.addEventListener('error',e=>showErr((e.message||'error')+' @'+String(e.filename||'').split('/').pop()+':'+e.lineno));
let sortedC={};const sortedAll=()=>sortedC[lang]||(sortedC[lang]=MATS.slice().sort((a,b)=>a[lang].localeCompare(b[lang])));
function opts(el,arr){el.innerHTML=arr.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('')}
function buildFilters(){const l=$('#fl').value,c=$('#fc').value,h=$('#fh').value;
 opts($('#fl'),[['',T('letter')+' ▾'],...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>[x,x])]);
 opts($('#fc'),[['',T('cat')+' ▾'],['chem/acid',T('c_acid')],['chem/base',T('c_base')],['chem/salt',T('c_salt')],['chem/oxide',T('c_oxide')],['chem/organic',T('c_org')],['chem/solvent',T('c_solv')],['chem/indicator',T('c_ind')],['chem/gas',T('c_gas')],['elem',T('c_elem')],['bio',T('c_bio')],['phys',T('c_phys')]]);
 opts($('#fh'),[['',T('hz')+' ▾'],...[0,1,2,3,4].map(x=>[x,'H'+x])]);$('#fl').value=l;$('#fc').value=c;$('#fh').value=h}
const cntText=()=>`${T('selected')}: ${sel.size} / ${MATS.length}`;
function renderBook(){const qq=$('#q').value.toLowerCase(),L=$('#fl').value,c=$('#fc').value,h=$('#fh').value;
 const r=sortedAll().filter(m=>{const n=m[lang];return(!qq||n.toLowerCase().includes(qq)||m.f.toLowerCase().includes(qq))&&(!L||n[0].toUpperCase()==L)&&(!c||m.cat.startsWith(c))&&(h===''||m.hz==h)}),N=20,pages=Math.max(1,Math.ceil(r.length/N));page=Math.min(page,pages-1);
 $('#ls').innerHTML=r.slice(page*N,page*N+N).map(m=>{const on=sel.has(m.code);return `<div class="r"><b>${m[lang]}</b><span>${m.f}</span><i class="h${m.hz}">H${m.hz}</i>`+(mode=='load'?`<button data-t="${m.code}" class="${on?'on':''}">${on?'✓':'＋'}</button>`:mode=='play'?`<button data-c="${m.code}">${on?T('fetch'):T('bring')}</button>`:'')+'</div>'}).join('');
 $('#pn').textContent=(page+1)+' / '+pages;$('#cnt').textContent=cntText();$('#cnt').hidden=$('#packs').hidden=$('#startb').hidden=mode!='load'}
