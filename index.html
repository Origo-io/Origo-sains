<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Origo Sains</title>
<style>
:root{--bg:#fff;--sf:#eefafb;--tx:#12202b;--pr:#00bcd4;--wr:#ff9800;--ok:#4caf50;--gl:rgba(255,255,255,.82)}
body[data-t=dark]{--bg:#121821;--sf:#1c2531;--tx:#fff;--pr:#26d9ee;--wr:#ffb033;--ok:#66c96a;--gl:rgba(18,24,33,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
button,select,input{font:inherit;border-radius:12px;border:1.5px solid var(--pr);padding:9px 12px;background:var(--bg);color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;font-weight:700;box-shadow:0 3px 10px #0003;transition:transform .08s}button:active{transform:scale(.93)}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:8px;z-index:9;justify-content:flex-end}
#top button{background:var(--gl);color:var(--pr);border:1.5px solid var(--pr);backdrop-filter:blur(6px);width:44px;height:44px;padding:0;font-size:18px;border-radius:50%}
.ov{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg) 40%,var(--sf));z-index:5;padding:64px 14px 14px;overflow:auto;touch-action:pan-y}
#menu{text-align:center;padding-top:16vh}
#menu h1{margin:0;font-size:44px;letter-spacing:1px;background:linear-gradient(90deg,var(--pr),var(--ok) 55%,var(--wr));-webkit-background-clip:text;background-clip:text;color:transparent}
#menu p{color:var(--ok);margin:6px 0 28px;font-weight:600}
#menu button{display:block;width:min(270px,82%);margin:12px auto;padding:15px;font-size:16px}
#menu .o{background:var(--wr)}#menu small{display:block;margin:24px auto;max-width:310px;opacity:.7;line-height:1.5}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}#q{width:100%}
.r{display:flex;align-items:center;gap:8px;padding:11px;margin:6px 0;background:var(--sf);border-radius:14px}
.r b{flex:1}.r span{opacity:.7;font-size:13px}.r i{font-style:normal;color:#fff;border-radius:8px;padding:2px 7px;font-size:12px;background:var(--ok)}
.r i.h2{background:var(--pr)}.r i.h3,.r i.h4{background:var(--wr)}.r button{padding:6px 12px}
#pg{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}#hud button,#js{pointer-events:auto}
#x{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--pr),0 0 8px var(--pr)}
#pr:not(:empty){position:absolute;left:50%;transform:translateX(-50%);bottom:160px;background:var(--gl);border:1.5px solid var(--pr);padding:6px 16px;border-radius:20px;font-weight:700;color:var(--tx);backdrop-filter:blur(6px);white-space:nowrap}
#log:not(:empty){position:absolute;left:50%;transform:translateX(-50%);top:62px;max-width:86%;background:var(--wr);color:#fff;padding:8px 16px;border-radius:14px;font-weight:700;text-align:center;box-shadow:0 4px 14px #0004}
#inf{position:absolute;left:10px;top:64px;background:var(--gl);backdrop-filter:blur(6px);border:1.5px solid var(--pr);border-radius:14px;padding:8px 12px;font-size:13px;min-width:140px;max-width:58%}
#inf s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #0003}
.bar{height:6px;border-radius:4px;background:var(--sf);margin:5px 0;overflow:hidden}.bar u{display:block;height:100%;background:var(--ok);transition:width .3s}
#js{position:absolute;left:20px;bottom:22px;width:124px;height:124px;border-radius:50%;background:var(--gl);border:2px solid var(--pr);backdrop-filter:blur(4px)}
#kn{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:var(--pr);box-shadow:0 3px 10px #0004}
#act,#pour{position:absolute;right:16px;width:84px;height:84px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
#act b,#pour b{font-size:26px}#act small,#pour small{font-size:11px}
#act{bottom:22px;background:var(--wr)}#pour{bottom:118px;background:var(--ok)}
</style></head><body data-t="light">
<canvas id="c"></canvas>
<div id="top"><button id="bm">☰</button><button id="bb">📖</button><button id="bl">ID</button><button id="bt">◐</button></div>
<div id="hud"><div id="x"></div><div id="log"></div><div id="inf" hidden></div><div id="pr"></div>
<div id="js"><div id="kn"></div></div>
<button id="pour"><b>💧</b><small data-i="pour"></small></button><button id="act"><b>✋</b><small data-i="act"></small></button></div>
<div id="menu" class="ov"><h1 data-i="title"></h1><p data-i="sub"></p>
<button id="go" class="o" data-i="enter"></button><button id="mb" data-i="book"></button><small data-i="hint"></small></div>
<div id="book" class="ov" hidden><input id="q"><div class="f"><select id="fl"></select><select id="fc"></select><select id="fh"></select></div>
<div id="ls"></div><div id="pg"><button id="pp">‹</button><span id="pn"></span><button id="pnx">›</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script><script src="app.js"></script></body></html>
